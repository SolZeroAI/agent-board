name: Release

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [master]

permissions:
  contents: read

# The release of a version commit has its own group. A newer pending run in one group
# replaces the older pending run, so a later master merge must not replace the only run
# that publishes a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ startsWith(github.event.workflow_run.head_commit.message, 'Version Packages') && '-publish' || '' }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or release Agent Board
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    # Writes go through the release app token. This job's GITHUB_TOKEN stays read-only.
    permissions:
      contents: read
    outputs:
      published: ${{ steps.published.outputs.published }}
      tag: ${{ steps.published.outputs.tag }}
      version: ${{ steps.published.outputs.version }}
      sha: ${{ steps.published.outputs.sha }}
    steps:
      - name: Create release app token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          # Credentials stay in the checkout so the v* tag push uses this token.
          token: ${{ steps.release-token.outputs.token }}

      - name: Set up Nub
        uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.10.0
          node-version-file: .nvmrc
          cache-dependency-path: nub.lock

      - name: Install dependencies
        run: nub install --frozen-lockfile

      # Only the version commit releases. Tegami writes VERSION, and this step reads it.
      # A squash merge of the solzero-bot Version Packages pull request is that commit:
      # the title starts with "Version Packages" and the author is solzero-bot.
      - name: Skip publish when the version tag exists
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ startsWith(github.event.workflow_run.head_commit.message, 'Version Packages') && github.event.workflow_run.head_commit.author.email == '341870119+solzero-bot[bot]@users.noreply.github.com' }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE_COMMIT" = "true" ] && [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${version}" >/dev/null 2>&1; then
            {
              echo "tag=v${version}"
              echo "version=${version}"
              echo "published=true"
            } >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Only the squash merge of the Tegami version pull request publishes, because only its
      # Validate run tests the release. Another master push only opens or updates the version
      # pull request. To publish again after a failure, re-run the Release run of the version commit.
      - name: Version or publish release
        run: |
          if [ "$RELEASE_COMMIT" = "true" ]; then
            nub run tegami ci
          else
            nub run tegami version --no-checks
          fi
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
          RELEASE_COMMIT: ${{ startsWith(github.event.workflow_run.head_commit.message, 'Version Packages') && github.event.workflow_run.head_commit.author.email == '341870119+solzero-bot[bot]@users.noreply.github.com' }}

  # Confirmed publish contract. The trusted publisher has no workflow file,
  # so any workflow on master can publish. This is the only publish job.
  # It uses the alchemy-new environment, the same as solstatus.
  # registry-url: https://alchemy.new (api.alchemy.new does not serve the API)
  # OIDC audience: https://alchemy.new/registry/publish
  # OIDC issuer: https://token.actions.githubusercontent.com
  # Exchange: POST https://alchemy.new/v1/oidc/github/exchange
  publish:
    name: Publish to alchemy.new
    needs: release
    if: >-
      github.ref == 'refs/heads/master' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      needs.release.outputs.published == 'true' &&
      needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: alchemy-new
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Set up Nub
        uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.10.0
          node-version-file: .nvmrc
          cache-dependency-path: nub.lock

      - name: Install, build, and prune production dependencies
        env:
          NPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE: "false"
        run: |
          nub install --frozen-lockfile
          nub run build
          nub prune --prod

      # The ready archive is the pruned tree. These excludes drop files the
      # deploy does not load. Node resolves the stack from compiled JavaScript.
      # The Worker bundler also loads the TypeScript sources named below.
      - name: Publish to alchemy.new
        uses: SolZeroAI/alchemy-new-publish-action@v1
        with:
          registry-url: https://alchemy.new
          version: ${{ needs.release.outputs.version }}
          path: .
          manifest: alchemy.new.jsonc
          exclude: |
            **/*.md
            **/*.map
            node_modules/**/*.ts
            node_modules/**/*.tsx
            node_modules/**/*.mts
            node_modules/**/*.cts
            # Node loads these Alchemy subpaths as TypeScript.
            !node_modules/**/alchemy/src/Runtime/Bootstrap.ts
            !node_modules/**/alchemy/src/Runtime/ManagedHttpShutdown.ts
            # The Worker bundler resolves these packages with the worker
            # condition, which is their TypeScript source. The generated
            # entry imports @alchemy.run/cloudflare/Bridge from that source.
            !node_modules/**/@alchemy.run/cloudflare/src/**
            !node_modules/**/@alchemy.run/cloudflare/src/**/*.ts
            !node_modules/**/@alchemy.run/better-auth/src/**
            !node_modules/**/@alchemy.run/better-auth/src/**/*.ts
            # The TanStack Start Vite plugin loads these entries while it builds the site.
            !node_modules/**/@tanstack/react-start/dist/plugin/default-entry/**
            !node_modules/**/@tanstack/react-start/dist/plugin/default-entry/**/*.ts
            !node_modules/**/@tanstack/react-start/dist/plugin/default-entry/**/*.tsx
            # Duplicate of @cloudflare/workerd-linux-64. The stack resolves that package when it loads.
            node_modules/.store/workerd@*/node_modules/workerd/bin/workerd
            # esbuild's JavaScript API loads @esbuild/linux-x64. This path is a second copy.
            node_modules/.store/esbuild@*/node_modules/esbuild/bin/esbuild
            # TypeScript's native binary. Alchemy transpiles the stack with Oxc.
            node_modules/.store/@typescript+typescript-linux-x64@*
            # sharp is a dynamic import of the local Images binding. This stack does not use it.
            node_modules/.store/@img+sharp-libvips-linux-*@*
            node_modules/.store/@img+sharp-linux-*@*
            # Prettier loads the Flow plugin only when the parser is Flow.
            node_modules/**/prettier/plugins/flow.js
            node_modules/**/prettier/plugins/flow.mjs
            # React's package exports resolve the production build unless a bundler sets the development condition.
            node_modules/**/*.development.js
            docs/**
            features/**
            scripts/**
            third-party/**
            e2e.config.ts
            packages/cli/**
            packages/sdk/**
