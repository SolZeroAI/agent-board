name: Validate

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      e2e_record:
        description: Record action replays instead of strict replay
        type: boolean
        default: false
      e2e_commit:
        description: Commit recorded replays to the dispatched branch
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job runs on every master push so the workflow succeeds and Release can start.
  gate:
    name: CI keepalive
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Keep the workflow green
        run: echo "Agent Board CI is awake."

  validate:
    name: Repository validation
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      !(github.event_name == 'pull_request' && github.head_ref == 'tegami/version-packages' && github.event.pull_request.user.login == 'solzero-bot[bot]') &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Version Packages') && github.event.head_commit.author.email == '341870119+solzero-bot[bot]@users.noreply.github.com'))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Nub
        uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.10.0
          node-version-file: .nvmrc
          cache-dependency-path: nub.lock

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Typecheck
        run: nub run typecheck

      - name: Lint
        run: nub run lint

      - name: Check formatting
        run: nub run format

      - name: Lint GitHub Actions workflows
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/actionlint"
          mkdir -p "${dest}"
          curl -fsSL https://raw.githubusercontent.com/kjanat/actionlint/master/distribution/install/download-actionlint.bash | bash -s -- latest "${dest}"
          "${dest}/actionlint"

      - name: Collect end-to-end tests
        run: nub run test:e2e:list

  e2e:
    name: End-to-end app flows
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      !(github.event_name == 'pull_request' && github.head_ref == 'tegami/version-packages' && github.event.pull_request.user.login == 'solzero-bot[bot]') &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Version Packages') && github.event.head_commit.author.email == '341870119+solzero-bot[bot]@users.noreply.github.com')) &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Nub
        uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.10.0
          node-version-file: .nvmrc
          cache-dependency-path: nub.lock

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Restore Playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: e2e-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('nub.lock') }}

      - name: Install Chromium
        run: nub run test:e2e:install

      - name: End-to-end
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.e2e_record }}" = "true" ]; then
            nub run test
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            nub run test:e2e:cache-strict -- --changed-since "origin/${{ github.base_ref }}" --pass-with-no-tests
            exit 0
          fi
          base="$(git log --grep='^Version Packages' --author='341870119+solzero-bot[bot]@users.noreply.github.com' --format=%H HEAD^ | head -n 1 || true)"
          if [ -n "$base" ]; then
            nub run test:e2e:cache-strict -- --changed-since "$base" --pass-with-no-tests
          else
            nub run test:e2e:cache-strict
          fi
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_AI_GATEWAY_E2E_TOKEN: ${{ secrets.CF_AI_GATEWAY_E2E_TOKEN }}
          CF_AI_GATEWAY_E2E_ID: ${{ vars.CF_AI_GATEWAY_E2E_ID }}
          E2E_DECISION_MODEL: ${{ vars.E2E_DECISION_MODEL }}
          E2E_LANGUAGE_MODEL: ${{ vars.E2E_LANGUAGE_MODEL }}
          E2E_TELEMETRY_DISABLED: "1"
          GITHUB_TOKEN: ${{ github.token }}
