name: Validate

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      e2e_record:
        description: Record action replays and upload .e2e/cache instead of strict replay
        type: boolean
        default: false
      e2e_commit:
        description: Commit the e2e_record recordings to the dispatched branch
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job runs on every master push so the workflow succeeds and Release can start.
  gate:
    name: CI keepalive
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Keep the workflow green
        run: echo "Agent Board CI is awake."

  validate:
    name: Repository validation
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      !(github.event_name == 'pull_request' && github.head_ref == 'tegami/version-packages' && github.event.pull_request.user.login == 'solzero-bot[bot]') &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Version Packages') && github.event.head_commit.author.email == '341870119+solzero-bot[bot]@users.noreply.github.com'))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Nub
        uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.10.0
          node-version-file: .nvmrc
          cache-dependency-path: nub.lock

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Typecheck
        run: nub run typecheck

      - name: Effect diagnostics
        run: nub run effect:diagnostics

      - name: Lint
        run: nub run lint

      - name: Check formatting
        run: nub run format

      - name: Lint GitHub Actions workflows
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/actionlint"
          mkdir -p "${dest}"
          curl -fsSL https://raw.githubusercontent.com/kjanat/actionlint/master/distribution/install/download-actionlint.bash | bash -s -- latest "${dest}"
          "${dest}/actionlint"

      - name: Collect end-to-end tests
        run: nub run test:e2e:list

  e2e:
    name: End-to-end app flows
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      !(github.event_name == 'pull_request' && github.head_ref == 'tegami/version-packages' && github.event.pull_request.user.login == 'solzero-bot[bot]') &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Version Packages') && github.event.head_commit.author.email == '341870119+solzero-bot[bot]@users.noreply.github.com')) &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    outputs:
      replays: ${{ steps.replays.outputs.present }}
    # The record path uploads .e2e/cache. The github reporter reads the run token.
    permissions:
      contents: read
      actions: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_AI_GATEWAY_E2E_TOKEN: ${{ secrets.CF_AI_GATEWAY_E2E_TOKEN }}
      E2E_DECISION_MODEL: ${{ vars.E2E_DECISION_MODEL }}
      E2E_LANGUAGE_MODEL: ${{ vars.E2E_LANGUAGE_MODEL }}
      E2E_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Nub
        uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.10.0
          node-version-file: .nvmrc
          cache-dependency-path: nub.lock

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Restore Playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: e2e-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('nub.lock') }}

      - name: Install Chromium
        run: nub run test:e2e:install

      - name: End-to-end
        id: e2e-run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          E2E_RECORD: ${{ github.event_name == 'workflow_dispatch' && inputs.e2e_record }}
        # Committed recordings replay strictly. A dispatched e2e_record run records them.
        run: |
          set -euo pipefail
          if [ "$E2E_RECORD" = "true" ]; then
            nub run test
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            nub run test:e2e:cache-strict --changed-since "origin/${{ github.base_ref }}" --pass-with-no-tests
            exit 0
          fi
          base="$(git log --grep='^Version Packages' --author='341870119+solzero-bot[bot]@users.noreply.github.com' --format=%H HEAD^ | head -n 1 || true)"
          if [ -n "$base" ]; then
            nub run test:e2e:cache-strict --changed-since "$base" --pass-with-no-tests
          else
            nub run test:e2e:cache-strict
          fi
      - name: Check for recorded action replays
        id: replays
        if: github.event_name == 'workflow_dispatch' && inputs.e2e_record && steps.e2e-run.outcome == 'success'
        run: |
          set -euo pipefail
          if [ -d .e2e/cache ] && [ -n "$(find .e2e/cache -type f -print -quit)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No action replays were recorded."
          fi
      - name: Upload recorded action replays
        if: steps.replays.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: agent-board-e2e-replays-${{ github.run_id }}-${{ github.run_attempt }}
          path: .e2e/cache
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  commit-replays:
    name: Commit recorded action replays
    needs: e2e
    # A dispatched e2e_record run commits its recordings to the branch it ran on.
    # The App token push starts pull request CI; a GITHUB_TOKEN push would not.
    # The gate job is not a dependency, so check the e2e result instead of success().
    if: ${{ !cancelled() && needs.e2e.result == 'success' && needs.e2e.outputs.replays == 'true' && github.event_name == 'workflow_dispatch' && inputs.e2e_record && inputs.e2e_commit && github.ref_name != github.event.repository.default_branch }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Check out the recorded commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Download recorded action replays
        uses: actions/download-artifact@v8
        with:
          name: agent-board-e2e-replays-${{ github.run_id }}-${{ github.run_attempt }}
          path: .e2e/cache
      - name: Commit and push changed recordings
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git add .e2e/cache
          if git diff --cached --quiet; then
            echo "The recordings did not change."
            exit 0
          fi
          user_id="$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -m "Update e2e action replay recordings" -m "Recorded by Validate run ${GITHUB_RUN_ID}."
          # The push fails when the branch moved after the recorded commit.
          # Run e2e_record again on the new head.
          git push origin "HEAD:refs/heads/${BRANCH}"
